<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A replay harness for testing AI agents against Plaid Transactions Sync changes."
    />
    <title>Plaid Agent Replay Lab</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="#overview"
          ><span class="brand-mark">P</span>Replay Lab</a
        ><span class="env">PLAID TRANSACTIONS SYNC</span
        ><span class="header-copy"
          >Sandbox item · cursor replay · SQLite</span
        ><span id="connection" class="connection">Checking Plaid…</span>
      </header>
      <aside>
        <p class="nav-label">AGENT RELIABILITY</p>
        <nav>
          <button class="active" data-view="overview">Overview</button
          ><button data-view="cases">Replay cases</button
          ><button data-view="trace">Cursor trace</button
          ><button data-view="method">Data path</button>
        </nav>
        <div class="sidebar-note">
          <b>For teams building financial agents</b
          ><span
            >Test whether an answer is supported by the current transaction
            state before it reaches a user.</span
          >
        </div>
      </aside>
      <main id="app" aria-live="polite">
        <div class="loading">Loading replay cases…</div>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
