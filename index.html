<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sentinel is a Plaid Transactions Sync prototype for reviewing unusual charges with deterministic checks and Claude."
    />
    <title>Sentinel — Plaid transaction review</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="incident.css" />
    <link rel="stylesheet" href="badge.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="#overview"
          ><span class="brand-mark">S</span>Sentinel</a
        ><span class="env">PLAID TRANSACTIONS</span
        ><span class="header-copy"
          >Sandbox item · Transactions Sync · SQLite</span
        ><span id="connection" class="connection">Checking Plaid…</span>
      </header>
      <aside>
        <p class="nav-label">SENTINEL</p>
        <nav>
          <button class="active" data-view="overview">Overview</button
          ><button data-view="alerts">Charges to review</button
          ><button data-view="trust">Compare decisions</button
          ><button data-view="method">What it sees</button>
        </nav>
        <div class="sidebar-note">
          <b>For the person reviewing a charge</b
          ><span
            >Sentinel explains a flag. It never contacts a bank or moves
            money.</span
          >
        </div>
      </aside>
      <main id="app" aria-live="polite">
        <div class="loading">Loading Sentinel…</div>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
